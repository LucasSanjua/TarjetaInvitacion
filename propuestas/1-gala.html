<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egreso Mateo · Noche de Gala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0b1630; --navy2:#14264d; --gold:#d4af37; --gold2:#f6e27a; --cream:#f7f1e1; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(ellipse at top,var(--navy2),var(--navy) 70%);color:var(--cream);font-family:Montserrat,sans-serif;overflow-x:hidden;min-height:100vh}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .card{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:56px 24px 64px;text-align:center}
  .frame{border:1px solid rgba(212,175,55,.5);border-radius:6px;padding:40px 18px;position:relative;background:rgba(11,22,48,.45);backdrop-filter:blur(2px)}
  .frame::before{content:"";position:absolute;inset:8px;border:1px solid rgba(212,175,55,.25);border-radius:4px;pointer-events:none}
  .reveal{opacity:0;transform:translateY(18px);animation:up 1s ease forwards}
  @keyframes up{to{opacity:1;transform:none}}
  .small{letter-spacing:.35em;font-size:.72rem;text-transform:uppercase;color:var(--gold2)}
  .script{font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--gold2);margin-top:18px}
  h1{font-family:'Playfair Display',serif;font-size:3.6rem;letter-spacing:.08em;margin:4px 0 6px;
     background:linear-gradient(100deg,#b8892b 20%,#fff3b0 40%,#d4af37 60%,#b8892b 80%);background-size:250% auto;
     -webkit-background-clip:text;background-clip:text;color:transparent;animation:up 1s ease forwards,shine 4s linear infinite}
  @keyframes shine{to{background-position:-250% center}}
  .name{font-family:'Playfair Display',serif;font-size:1.55rem;line-height:1.3;margin:20px 0 8px}
  .divider{width:120px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
  .divider::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:var(--gold);background:var(--navy);padding:0 8px;font-size:.8rem}
  .date{display:flex;justify-content:center;align-items:center;gap:14px;font-family:'Playfair Display',serif}
  .date .side{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:6px 10px;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;min-width:92px}
  .date .day{font-size:3.4rem;color:var(--gold2);line-height:1}
  .month{margin-top:8px;letter-spacing:.3em;text-transform:uppercase;font-size:.85rem}
  .count{display:flex;justify-content:center;gap:10px;margin:28px 0 6px}
  .count div{width:66px;padding:10px 0;border:1px solid rgba(212,175,55,.45);border-radius:6px}
  .count b{display:block;font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold2)}
  .count span{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;opacity:.8}
  .info{font-size:.9rem;line-height:1.7;opacity:.9;margin-top:18px}
  .btn{display:inline-block;margin-top:26px;padding:14px 30px;border-radius:40px;text-decoration:none;color:var(--navy);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;
       background:linear-gradient(135deg,#b8892b,#f6e27a,#d4af37);box-shadow:0 0 0 rgba(212,175,55,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)}70%{box-shadow:0 0 0 16px rgba(212,175,55,0)}100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}}
  .cap{font-size:2.6rem;display:inline-block;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(-6deg)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="card">
  <div class="frame">
    <div class="reveal" style="animation-delay:.1s"><span class="cap">🎓</span></div>
    <p class="small reveal" style="animation-delay:.3s">Promoción 2026</p>
    <p class="script reveal" style="animation-delay:.6s">Te invito a celebrar mi</p>
    <h1 class="reveal" style="animation-delay:.9s">EGRESO</h1>
    <div class="divider reveal" style="animation-delay:1.2s"></div>
    <p class="name reveal" style="animation-delay:1.4s">Mateo David<br>Rodríguez Zamora</p>
    <div class="divider reveal" style="animation-delay:1.6s"></div>
    <div class="reveal" style="animation-delay:1.8s">
      <div class="date"><div class="side">Martes</div><div class="day">01</div><div class="side">21:00 hs</div></div>
      <p class="month">Diciembre · 2026</p>
    </div>
    <div class="count reveal" style="animation-delay:2.1s">
      <div><b id="d">0</b><span>días</span></div><div><b id="h">0</b><span>horas</span></div>
      <div><b id="m">0</b><span>min</span></div><div><b id="s">0</b><span>seg</span></div>
    </div>
    <p class="info reveal" style="animation-delay:2.3s">📍 Lugar a confirmar<br>Dress code: Elegante</p>
    <a class="btn reveal" style="animation-delay:2.5s" href="#">Confirmar asistencia</a>
  </div>
</main>
<script>
  // Cuenta regresiva
  const target = new Date('2026-12-01T21:00:00');
  function tick(){ let t=Math.max(0,target-new Date());
    d.textContent=Math.floor(t/864e5); h.textContent=Math.floor(t/36e5)%24;
    m.textContent=Math.floor(t/6e4)%60; s.textContent=Math.floor(t/1e3)%60; }
  tick(); setInterval(tick,1000);

  // Estrellas titilando + destellos dorados cayendo
  const c=document.getElementById('fx'),x=c.getContext('2d'); let W,H,stars=[],dust=[];
  function size(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; }
  size(); addEventListener('resize',size);
  for(let i=0;i<120;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6});
  for(let i=0;i<45;i++) dust.push({x:Math.random(),y:Math.random(),v:Math.random()*.0015+.0005,r:Math.random()*2+1,w:Math.random()*6});
  (function loop(t){ x.clearRect(0,0,W,H); const k=devicePixelRatio;
    stars.forEach(s=>{ x.globalAlpha=.3+.7*Math.abs(Math.sin(t/900+s.p)); x.fillStyle='#fff';
      x.beginPath(); x.arc(s.x*W,s.y*H,s.r*k,0,7); x.fill(); });
    dust.forEach(p=>{ p.y+=p.v; if(p.y>1.02){p.y=-.02;p.x=Math.random()}
      x.globalAlpha=.8; x.fillStyle='#f6e27a';
      x.beginPath(); x.arc((p.x+Math.sin(t/1000+p.w)*.01)*W,p.y*H,p.r*k,0,7); x.fill(); });
    requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
