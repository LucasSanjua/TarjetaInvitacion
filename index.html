<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Egreso de Mateo · 1 de Diciembre</title>
    <meta
      name="description"
      content="Te invito a celebrar el egreso de Mateo David Rodríguez Zamora · Martes 1 de diciembre · 19 hs · EPET N° 20, Neuquén">
    <meta
      property="og:title"
      content="Egreso de Mateo David Rodríguez Zamora">
    <meta
      property="og:description"
      content="Martes 1 de diciembre de 2026 · 19:00 hs · EPET N° 20, Neuquén">
    <meta
      property="og:image"
      content="https://lucassanjua.github.io/TarjetaInvitacion/portada-whatsapp.jpg?v=tarjeta">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta
      property="og:image:alt"
      content="Tarjeta de invitación con un sobre crema y un sello verde esmeralda con la inicial M">
    <meta name="theme-color" content="#0b4a37">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-sobre.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Parisienne&amp;family=Lato:wght@300;400&amp;display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="assets/css/invitacion.css">
    <script src="assets/js/invitacion.js" defer></script>
  </head>
  <body>
    <div class="stage" id="stage" hidden>
      <button
        class="env"
        id="opener"
        type="button"
        aria-label="Abrir invitación"
        aria-controls="card"
      >
        <span class="flap" aria-hidden="true"></span>
        <span class="pocket" aria-hidden="true"></span>
        <span class="seal" aria-hidden="true">M</span>
        <span class="hint" aria-hidden="true">Tocá el sobre para abrirlo</span>
      </button>
    </div>

    <main class="card" id="card" tabindex="-1" aria-labelledby="title">
      <div class="paper">
        <div class="edge" aria-hidden="true"></div>
        <p class="over">Promoción 2026</p>
        <p class="script">Con alegría<br>te invito a mi</p>
        <h1 id="title">EGRESO</h1>
        <p class="name">Mateo David<br>Rodríguez Zamora</p>
        <div class="line" aria-hidden="true"></div>
        <p class="date">
          <time id="event-date" datetime="2026-12-01T19:00:00-03:00"
            >Martes<strong>1 de diciembre</strong>2026 · 19:00 hs</time
          >
        </p>
        <div class="line" aria-hidden="true"></div>
        <div
          class="count"
          id="countdown"
          role="timer"
          aria-label="Cuenta regresiva"
          hidden
        >
          <div><b id="d">0</b><span>días</span></div>
          <div><b id="h">0</b><span>horas</span></div>
          <div><b id="m">0</b><span>minutos</span></div>
          <div><b id="s">0</b><span>segundos</span></div>
        </div>
        <div class="place">
          <p class="place-name">EPET N° 20</p>
          <p class="place-sub">“Poeta Marcelo Berbel” · Neuquén</p>
          <a
            class="map-btn"
            target="_blank"
            rel="noopener"
            href="https://www.google.com/maps/search/?api=1&amp;query=EPET+20+Poeta+Marcelo+Berbel+Neuqu%C3%A9n"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"
              />
              <circle cx="12" cy="9.5" r="2.5" />
            </svg>
            Cómo llegar
          </a>
        </div>
        <p class="info"><em>Tu presencia es mi mejor regalo</em></p>
      </div>
    </main>
  </body>
</html>
