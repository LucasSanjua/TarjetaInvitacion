<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egreso de Mateo · 1 de Diciembre</title>
<meta name="description" content="Te invito a celebrar el egreso de Mateo David Rodríguez Zamora · Martes 1 de diciembre · 19 hs · EPET N° 20, Neuquén">
<meta property="og:title" content="Egreso de Mateo David Rodríguez Zamora">
<meta property="og:description" content="Martes 1 de diciembre de 2026 · 19:00 hs · EPET N° 20, Neuquén">
<meta property="og:image" content="https://lucassanjua.github.io/TarjetaInvitacion/portada-whatsapp.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Egreso de Mateo, con un sobre crema y un sello verde esmeralda con la inicial M">
<meta name="theme-color" content="#0b4a37">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Parisienne&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#0b6e4f;      /* verde esmeralda del traje */
    --emerald-d:#06402e;
    --emerald-l:#2e9e73;
    --gold:#c9a24a;
    --gold-l:#ecd58f;
    --cream:#fbf7ee;
    --ink:#23332c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:Lato,sans-serif;color:var(--ink);overflow-x:hidden;
       background:radial-gradient(circle at 20% 0%,#15845f 0%,transparent 45%),
                  radial-gradient(circle at 90% 100%,#032a1e 0%,transparent 50%),
                  linear-gradient(160deg,var(--emerald) 0%,var(--emerald-d) 100%);
       background-attachment:fixed}
  .leaf{position:fixed;top:-40px;font-size:22px;z-index:0;animation:fall linear infinite;opacity:.85;pointer-events:none}
  @keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}

  /* ---- Sobre ---- */
  .stage{position:fixed;inset:0;display:grid;place-items:center;z-index:5;transition:opacity .8s .9s}
  .stage.open{opacity:0;pointer-events:none}
  .env{position:relative;width:min(86vw,340px);aspect-ratio:1.45;background:#f1e9d6;border-radius:6px;
       box-shadow:0 24px 50px rgba(0,0,0,.4);cursor:pointer;animation:wiggle 2.5s ease-in-out infinite}
  .stage.open .env{animation:none}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}95%{transform:rotate(-2deg)}}
  .env .pocket{position:absolute;inset:0;border-radius:6px;z-index:3;
      background:linear-gradient(to top right,#e9dfc7 50%,transparent 50.5%) left/50% 100% no-repeat,
                 linear-gradient(to top left,#e2d6ba 50%,transparent 50.5%) right/50% 100% no-repeat}
  .env .flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:4;transform-origin:top;transition:transform .8s ease;
      background:#dccfb2;clip-path:polygon(0 0,100% 0,50% 100%)}
  .stage.open .flap{transform:rotateX(180deg);z-index:1}
  .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:5;width:64px;height:64px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#2fa57a,var(--emerald) 55%,var(--emerald-d));
      border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold-l);
      font-family:Parisienne,cursive;font-size:1.7rem;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:opacity .3s}
  .stage.open .seal{opacity:0}
  .hint{position:absolute;bottom:-50px;left:0;right:0;text-align:center;color:var(--gold-l);
        font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.45}}

  /* ---- Tarjeta ---- */
  .card{position:relative;z-index:2;max-width:420px;margin:32px auto;padding:0 18px;opacity:0;transform:translateY(80px);
        transition:all 1s cubic-bezier(.2,.8,.2,1) 1s}
  .card.show{opacity:1;transform:none}
  .paper{background:var(--cream);border-radius:4px;padding:48px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);
         position:relative;overflow:hidden}
  .paper .edge{position:absolute;inset:10px;border:1px solid var(--gold);border-radius:2px;pointer-events:none;opacity:.7}
  .paper::before,.paper::after{content:"🌿";position:absolute;font-size:64px}
  .paper::before{top:-14px;left:-10px;transform:rotate(-30deg)}
  .paper::after{bottom:-14px;right:-10px;transform:rotate(150deg)}
  .over{letter-spacing:.35em;font-size:.7rem;text-transform:uppercase;color:var(--gold)}
  .script{font-family:Parisienne,cursive;font-size:2.2rem;color:var(--gold);margin-top:14px;line-height:1.2}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:3.4rem;letter-spacing:.12em;color:var(--emerald);line-height:1.1}
  .name{font-family:'Cormorant Garamond',serif;font-size:1.75rem;margin:20px 0;line-height:1.2;color:var(--emerald-d)}
  .line{height:1px;width:70%;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .date{font-family:'Cormorant Garamond',serif;font-size:1.25rem;margin:18px 0;line-height:1.5}
  .date b{font-size:2.6rem;color:var(--emerald);display:block;line-height:1.1}
  .count{display:flex;justify-content:center;gap:14px;margin:18px 0;font-family:'Cormorant Garamond',serif}
  .count b{display:block;font-size:1.9rem;color:var(--emerald)}
  .count span{font-family:Lato;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase}
  .info{font-size:.95rem;line-height:1.7;margin-top:22px}
  .place{margin-top:6px}
  .place-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.7rem;color:var(--emerald);letter-spacing:.06em}
  .place-sub{font-size:.85rem;letter-spacing:.05em;opacity:.8}
  .map-btn{position:relative;display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:13px 26px;
           text-decoration:none;color:var(--emerald);border:1px solid var(--emerald);background:transparent;
           font-family:Lato,sans-serif;font-weight:400;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
           overflow:hidden;transition:color .4s,background .4s}
  /* segundo marco dorado, como el borde de la carta */
  .map-btn::before{content:"";position:absolute;inset:3px;border:1px solid var(--gold);opacity:.7;pointer-events:none}
  /* destello dorado que cruza el botón cada tanto */
  .map-btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
           background:linear-gradient(100deg,transparent,rgba(236,213,143,.55),transparent);transform:skewX(-20deg);
           animation:sheen 4.5s ease-in-out 3s infinite}
  @keyframes sheen{0%{left:-60%}35%,100%{left:130%}}
  .map-btn svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.4;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .map-btn:hover,.map-btn:active{background:var(--emerald);color:var(--cream)}
  .map-btn:active{transform:scale(.97)}
  .info em{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--emerald-d)}

  /* aparición escalonada del contenido al abrir */
  .paper > *:not(.edge){opacity:0;transform:translateY(12px)}
  .card.show .paper > *:not(.edge){animation:up .8s ease both}
  @keyframes up{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="stage" id="stage" onclick="openIt()" role="button" aria-label="Abrir invitación">
  <div class="env">
    <div class="flap"></div><div class="pocket"></div><div class="seal">M</div>
    <p class="hint">Tocá el sobre para abrirlo</p>
  </div>
</div>

<main class="card" id="card">
  <div class="paper">
    <div class="edge"></div>
    <p class="over">Promoción 2026</p>
    <p class="script">Con alegría<br>te invito a mi</p>
    <h1>EGRESO</h1>
    <p class="name">Mateo David<br>Rodríguez Zamora</p>
    <div class="line"></div>
    <p class="date">Martes<b>1 de Diciembre</b>2026 · 19:00 hs</p>
    <div class="line"></div>
    <div class="count">
      <div><b id="d">0</b><span>días</span></div><div><b id="h">0</b><span>horas</span></div>
      <div><b id="m">0</b><span>min</span></div><div><b id="s">0</b><span>seg</span></div>
    </div>
    <div class="place">
      <p class="place-name">EPET N° 20</p>
      <p class="place-sub">“Poeta Marcelo Berbel” · Neuquén</p>
      <a class="map-btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=EPET+20+Poeta+Marcelo+Berbel+Neuqu%C3%A9n">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        Cómo llegar
      </a>
    </div>
    <p class="info"><em>Tu presencia es mi mejor regalo</em></p>
  </div>
</main>
<script>
  // Escalonar la aparición de cada línea de la tarjeta
  [...document.querySelectorAll('.paper > *:not(.edge)')].forEach((el,i)=>el.style.animationDelay=(1.6+i*.15)+'s');

  function openIt(){
    if(stage.classList.contains('open')) return;
    stage.classList.add('open'); card.classList.add('show'); leaves();
  }
  function leaves(){
    const e=['🍃','🌿','✨','🍃'];
    for(let i=0;i<16;i++){
      const l=document.createElement('span'); l.className='leaf'; l.textContent=e[i%e.length];
      l.style.left=Math.random()*100+'vw';
      l.style.animationDuration=(8+Math.random()*8)+'s';
      l.style.animationDelay=(Math.random()*-12)+'s';
      document.body.appendChild(l);
    }
  }

  // Cuenta regresiva hasta el martes 1/12/2026 a las 19 hs (hora Argentina)
  const target=new Date('2026-12-01T19:00:00-03:00');
  function tick(){
    const t=Math.max(0,target-new Date());
    d.textContent=Math.floor(t/864e5); h.textContent=Math.floor(t/36e5)%24;
    m.textContent=Math.floor(t/6e4)%60; s.textContent=Math.floor(t/1e3)%60;
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
